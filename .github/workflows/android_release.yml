name: Android Release APK Builder

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release HTML to APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Keystore & Environment
        run: |
          # Generate debug.keystore if not present so signingConfigs.debugConfig finds it
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          touch .env

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Organize APK Artifacts
        run: |
          mkdir -p build-artifacts
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp "app/build/outputs/apk/debug/app-debug.apk" "build-artifacts/HTML_to_APK_v1.0.apk"
          fi
          echo "Listing build-artifacts directory:"
          ls -la build-artifacts/

      - name: Upload APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HTML_to_APK_v1.0
          path: build-artifacts/HTML_to_APK_v1.0.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release & Upload APK
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          name: HTML to APK Release ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          make_latest: true
          body: |
            ## 🚀 HTML to APK Builder - Official Production Release
            - Standalone offline Web-to-APK engine
            - Supports HTML5, CSS3, JS, WebGL, Canvas, and media
            - Website to APK with pull-to-refresh & offline fallback
            - Dynamic AXML package modifier (installs as independent app)
            - Signed with Google ApkSigner (v1, v2, v3 schemes)
            - Ready for deployment on Android 7.0+ (API 24+) through Android 15 (API 35)
            
            **Asset:** `HTML_to_APK_v1.0.apk`
          files: build-artifacts/HTML_to_APK_v1.0.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
